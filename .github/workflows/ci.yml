name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_DAEMON: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: "tree:0"
      - uses: ./.github/actions/setup-node
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      - name: Lint
        run: npx nx affected -t lint --parallel=3
      - name: Test
        run: bash scripts/ci/test.sh
      - name: Build
        run: npx nx affected -t build --parallel=3

  sca:
    name: sca
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-node
        with:
          install: false
      - name: Checkout comparison tree
        id: sca-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          present=false
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${BASE_REF}" --depth=1
            git worktree add "${RUNNER_TEMP}/sca-base" "origin/${BASE_REF}"
            present=true
          elif [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            git fetch --depth=1 origin "${BEFORE_SHA}"
            git worktree add "${RUNNER_TEMP}/sca-base" "${BEFORE_SHA}"
            present=true
          else
            echo "No comparison commit; SCA uses the absolute gate."
          fi
          echo "present=${present}" >> "$GITHUB_OUTPUT"
      - name: Collect SCA inputs
        run: |
          mkdir -p .sca-out
          npm audit --json --package-lock-only > .sca-out/audit-head.json || true
          if [[ -d "${RUNNER_TEMP}/sca-base" ]]; then
            (cd "${RUNNER_TEMP}/sca-base" && npm audit --json --package-lock-only > "${GITHUB_WORKSPACE}/.sca-out/audit-base.json") || true
          fi
      - name: Trivy filesystem scan (head)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: json
          scanners: vuln
          skip-dirs: .sca-out,node_modules
          output: .sca-out/trivy-head.json
      - name: Trivy filesystem scan (base)
        if: steps.sca-base.outputs.present == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/sca-base
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: json
          scanners: vuln
          skip-dirs: node_modules
          output: .sca-out/trivy-base.json
      - name: SCA gate
        run: |
          node scripts/ci/sca-ids.js selfcheck
          for f in .sca-out/audit-head.json .sca-out/trivy-head.json; do
            test -f "$f" || { echo "missing $f"; exit 2; }
          done
          args=(
            gate
            --audit-head .sca-out/audit-head.json
            --trivy-head .sca-out/trivy-head.json
          )
          if [[ -f .sca-out/audit-base.json && -f .sca-out/trivy-base.json ]]; then
            args+=(--audit-base .sca-out/audit-base.json --trivy-base .sca-out/trivy-base.json)
          fi
          node scripts/ci/sca-ids.js "${args[@]}"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: open_garden
          POSTGRES_PASSWORD: open_garden
          POSTGRES_DB: open_garden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_garden -d open_garden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://open_garden:open_garden@localhost:5432/open_garden
      SESSION_SECRET: ci-session-secret
      CORS_ORIGIN: http://localhost:4200
      PLANT_PROVIDER: fixture
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - name: Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: End-to-end tests
        run: bash scripts/ci/e2e.sh
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            apps/web-e2e/playwright-report/
            apps/web-e2e/test-results/
