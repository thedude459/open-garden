name: CI

on:
  pull_request:
  push:
    branches: [main, '*-plant-database', '*-household-gardens', '*-planting-calendar']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      - run: bash scripts/ci/test.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      - run: npx nx affected -t lint --parallel=3

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      - run: npx nx affected -t build --parallel=3

  sca:
    name: sca
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: Checkout base tree for SCA diff
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git worktree add "${{ runner.temp }}/sca-base" "origin/${{ github.base_ref }}"
      - name: Collect SCA inputs
        run: |
          mkdir -p .sca-out/head .sca-out/base
          npm audit --json --package-lock-only > .sca-out/audit-head.json || true
          cp package-lock.json .sca-out/head/package-lock.json
          if [[ -d "${{ runner.temp }}/sca-base" ]]; then
            (cd "${{ runner.temp }}/sca-base" && npm audit --json --package-lock-only > "${{ github.workspace }}/.sca-out/audit-base.json") || true
            cp "${{ runner.temp }}/sca-base/package-lock.json" .sca-out/base/package-lock.json
          fi
      - name: Trivy filesystem scan (head)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: json
          scanners: vuln
          skip-dirs: .sca-out
          output: .sca-out/trivy-head.json
      - name: Trivy filesystem scan (base)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/sca-base
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: json
          scanners: vuln
          output: .sca-out/trivy-base.json
      - name: OSV Scanner (head)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@f4cfcc01edc9c8b756a9b873b7a623ca674da51e # v2.3.8
        with:
          scan-args: |-
            --lockfile=.sca-out/head/package-lock.json
            --format=json
            --output=.sca-out/osv-head.json
            --verbosity=error
      - name: OSV Scanner (base)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@f4cfcc01edc9c8b756a9b873b7a623ca674da51e # v2.3.8
        with:
          scan-args: |-
            --lockfile=.sca-out/base/package-lock.json
            --format=json
            --output=.sca-out/osv-base.json
            --verbosity=error
      - name: SCA gate
        env:
          COMPARE_BASE: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          node scripts/ci/sca-ids.js selfcheck
          for f in .sca-out/audit-head.json .sca-out/trivy-head.json .sca-out/osv-head.json; do
            test -f "$f" || { echo "missing $f"; exit 2; }
          done
          args=(
            gate
            --audit-head .sca-out/audit-head.json
            --trivy-head .sca-out/trivy-head.json
            --osv-head .sca-out/osv-head.json
          )
          if [[ -n "${COMPARE_BASE}" ]]; then
            for f in .sca-out/audit-base.json .sca-out/trivy-base.json .sca-out/osv-base.json; do
              test -f "$f" || { echo "missing $f"; exit 2; }
            done
            args+=(--audit-base .sca-out/audit-base.json --trivy-base .sca-out/trivy-base.json --osv-base .sca-out/osv-base.json)
          fi
          node scripts/ci/sca-ids.js "${args[@]}"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: open_garden
          POSTGRES_PASSWORD: open_garden
          POSTGRES_DB: open_garden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_garden -d open_garden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://open_garden:open_garden@localhost:5432/open_garden
      SESSION_SECRET: ci-session-secret
      CORS_ORIGIN: http://localhost:4200
      PLANT_PROVIDER: fixture
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - name: End-to-end tests
        run: bash scripts/ci/e2e.sh
