name: Release

# Run from Actions -> Release -> Run workflow, on main, with the version
# (CONTRIBUTING.md, "Releasing"). It checks that CHANGELOG.md has that
# version's entry and that every published security advisory fixed in it is
# named there, then creates a draft GitHub Release with the notes, builds the
# api and web images for amd64 and arm64, pushes them to ghcr.io with an SBOM
# and build provenance, scans them, attaches the install compose.yaml, and
# publishes the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0 (CHANGELOG.md must have "## v0.2.0 (date)")'
        required: true
        type: string
      prerelease:
        description: 'A release candidate (e.g. 0.3.0-rc.1): no latest tag'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/open-garden

jobs:
  notes:
    name: notes and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Create the draft release.
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version and branch
        id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 1.2.3 or 1.3.0-rc.1 (got ${VERSION})" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Run the release from main (got ${GITHUB_REF})" >&2
            exit 1
          fi
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/ci/release-notes.js selfcheck
          node scripts/ci/release-notes.js check
          node scripts/ci/release-notes.js notes "${VERSION}" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Every advisory fixed in this version is in the notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/security-advisories?state=published&per_page=100" \
            --jq '.[]' | jq -s . > advisories.json
          node scripts/ci/release-notes.js advisories "${VERSION}" advisories.json
      - name: Create the draft release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--draft --target "${GITHUB_SHA}" --title "Open Garden ${TAG}" --notes-file notes.md)
          if [[ "${PRERELEASE}" == "true" ]]; then args+=(--prerelease); fi
          gh release create "${TAG}" "${args[@]}" --repo "${GITHUB_REPOSITORY}"

  images:
    name: images (${{ matrix.image }})
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          # 1.2.3, 1.2, 1, and latest for stable releases; only the exact
          # version for pre-releases (v1.3.0-rc.1).
          tags: |
            type=semver,pattern={{version}},value=${{ needs.notes.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.notes.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.notes.outputs.tag }}
          flavor: |
            latest=${{ !inputs.prerelease }}
          labels: |
            org.opencontainers.image.title=open-garden-${{ matrix.image }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - name: Date for OS package updates
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          build-args: OS_PACKAGES_DATE=${{ steps.today.outputs.date }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: '1'
          format: table

  compose:
    name: attach compose.yaml
    needs: [notes, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Upload release assets; sign compose.yaml with a provenance attestation.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin the release version in compose.yaml
        env:
          VERSION: ${{ needs.notes.outputs.version }}
        run: |
          sed "s/\${OPEN_GARDEN_VERSION:-latest}/\${OPEN_GARDEN_VERSION:-${VERSION}}/" deploy/compose.yaml > compose.yaml
          grep -q "OPEN_GARDEN_VERSION:-${VERSION}" compose.yaml
      - name: Sign compose.yaml (build provenance)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: compose.yaml
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.notes.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # The Sigstore bundle lets anyone verify compose.yaml came from this
          # workflow: gh attestation verify compose.yaml --owner <owner>
          cp "${BUNDLE}" compose.yaml.sigstore.json
          gh release upload "${TAG}" compose.yaml compose.yaml.sigstore.json --clobber --repo "${GITHUB_REPOSITORY}"

  publish:
    name: publish
    needs: [notes, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Publish the draft: this creates the tag at the commit it was built from.
      contents: write
    steps:
      - name: Publish the release
        env:
          TAG: ${{ needs.notes.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${TAG}" --draft=false --repo "${GITHUB_REPOSITORY}"
