name: CI

on:
  pull_request:
  push:
    branches: [main, '*-plant-database']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4
      - run: npx nx affected -t test --parallel=3
      - name: Coverage gate (≥80%)
        run: npm run test:coverage

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4
      - run: npx nx affected -t lint --parallel=3

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4
      - run: npx nx affected -t build --parallel=3

  sca:
    name: sca
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - name: Trivy filesystem scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          scanners: vuln
      - name: OSV Scanner (lockfile)
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --verbosity=error

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: open_garden
          POSTGRES_PASSWORD: open_garden
          POSTGRES_DB: open_garden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_garden -d open_garden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://open_garden:open_garden@localhost:5432/open_garden
      SESSION_SECRET: ci-session-secret
      PORT: '3000'
      CORS_ORIGIN: http://localhost:4200
      PLANT_PROVIDER: fixture
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup-node
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Migrate and seed
        run: npx nx run api:sync-plants
      - name: Start API
        run: npx tsx apps/api/src/main.ts &
      - name: Start web
        run: npx nx serve web --host=0.0.0.0 --port=4200 &
      - name: Wait for services
        run: |
          for i in $(seq 1 90); do
            WEB=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 || true)
            API=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/plants || true)
            if [ "$WEB" = "200" ] && [ "$API" = "401" ]; then
              echo "Services ready (web=$WEB api=$API)"
              exit 0
            fi
            sleep 2
          done
          echo "Services did not become ready (web=$WEB api=$API)"
          exit 1
      - name: Run Playwright
        run: npx nx e2e web-e2e
