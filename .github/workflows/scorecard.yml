name: Scorecard

# OpenSSF Scorecard: checks the repository against supply-chain security
# practices (pinned dependencies, branch protection, token permissions,
# signed releases, …). Results appear under Security → Code scanning and on
# the public Scorecard site.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
          # Fine-grained token with read-only Administration on this repository,
          # so the Branch-Protection check can read the protection rules.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}
      - name: Keep the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 14
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
