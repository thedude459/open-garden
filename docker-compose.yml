services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: open_garden
      POSTGRES_PASSWORD: open_garden
      POSTGRES_DB: open_garden
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_garden -d open_garden"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
