version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # typescript-eslint does not support TypeScript 7.0 yet
    # (https://github.com/typescript-eslint/typescript-eslint/issues/10940).
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    # One PR per group. Keep Nest/Vitest majors together so peer sets
    # are not split across PRs. Other ungrouped majors stay individual.
    groups:
      nestjs-major:
        applies-to: version-updates
        patterns:
          - '@nestjs/*'
        update-types:
          - major
      vitest-major:
        applies-to: version-updates
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - major
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # First match wins. Keep CodeQL init + analyze on one SHA.
      codeql-action:
        patterns:
          - 'github/codeql-action*'
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
