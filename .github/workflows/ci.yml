name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NX_DAEMON: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: 'tree:0'
      - uses: ./.github/actions/setup-node
      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - name: Lint
        run: npx nx affected -t lint --parallel=3
      - name: Dependency licenses
        run: |
          node scripts/ci/license-check.js selfcheck
          node scripts/ci/license-check.js
      - name: Test
        run: bash scripts/ci/test.sh
      - name: Whole-codebase coverage (report only)
        run: |
          node scripts/ci/coverage-summary.js selfcheck
          npm run test:coverage:all
      - name: Upload whole-codebase coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-all
          path: coverage/all/
          retention-days: 14
      - name: Build
        run: npx nx affected -t build --parallel=3

  workflows:
    # Lints the GitHub Actions workflows: actionlint for correctness, zizmor for
    # security (unpinned or impostor actions, credential leaks, injection).
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color=false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo \
            ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9 \
            --min-severity low --format github .github/workflows/ .github/actions/

  sca:
    name: sca
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/setup-node
        with:
          install: false
      - name: Checkout comparison tree
        id: sca-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          present=false
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${BASE_REF}" --depth=1
            git worktree add "${RUNNER_TEMP}/sca-base" "origin/${BASE_REF}"
            present=true
          elif [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            git fetch --depth=1 origin "${BEFORE_SHA}"
            git worktree add "${RUNNER_TEMP}/sca-base" "${BEFORE_SHA}"
            present=true
          else
            echo "No comparison commit; SCA uses the absolute gate."
          fi
          echo "present=${present}" >> "$GITHUB_OUTPUT"
      - name: Collect SCA inputs
        run: |
          mkdir -p .sca-out
          audit_to() {
            local dest="$1"
            local dir="$2"
            local attempt code
            mkdir -p "$(dirname "$dest")"
            for attempt in 1 2 3; do
              set +e
              # Absolute dest: the redirect must not follow `cd` into the base tree.
              (cd "$dir" && npm audit --json --package-lock-only > "$dest")
              code=$?
              set -e
              if [[ "$code" -le 1 ]] && node -e '
                const data = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
                if (data.error && !data.vulnerabilities) process.exit(1);
              ' "$dest"; then
                return 0
              fi
              echo "npm audit attempt ${attempt} failed in ${dir} (exit ${code})"
              sleep 5
            done
            echo "npm audit failed in ${dir}"
            return 1
          }
          audit_to "${GITHUB_WORKSPACE}/.sca-out/audit-head.json" "${GITHUB_WORKSPACE}"
          if [[ -d "${RUNNER_TEMP}/sca-base" ]]; then
            audit_to "${GITHUB_WORKSPACE}/.sca-out/audit-base.json" "${RUNNER_TEMP}/sca-base"
          fi
      - name: Trivy filesystem scan (head)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: json
          scanners: vuln
          skip-dirs: .sca-out,node_modules
          output: .sca-out/trivy-head.json
      - name: Trivy filesystem scan (base)
        if: steps.sca-base.outputs.present == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/sca-base
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: json
          scanners: vuln
          skip-dirs: node_modules
          output: .sca-out/trivy-base.json
      - name: SCA gate
        run: |
          node scripts/ci/sca-ids.js selfcheck
          for f in .sca-out/audit-head.json .sca-out/trivy-head.json; do
            test -f "$f" || { echo "missing $f"; exit 2; }
          done
          args=(
            gate
            --audit-head .sca-out/audit-head.json
            --trivy-head .sca-out/trivy-head.json
          )
          if [[ -f .sca-out/audit-base.json && -f .sca-out/trivy-base.json ]]; then
            args+=(--audit-base .sca-out/audit-base.json --trivy-base .sca-out/trivy-base.json)
          fi
          node scripts/ci/sca-ids.js "${args[@]}"

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    # Builds the images people run, lints the Dockerfiles, and fails on fixable
    # HIGH/CRITICAL vulnerabilities in the final image (OS packages and anything
    # left in the runtime filesystem). Nothing is pushed.
    name: images (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Decide whether the images need building
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          base=""
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${BASE_REF}" --depth=1
            base="origin/${BASE_REF}"
          elif [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            git fetch --depth=1 origin "${BEFORE_SHA}"
            base="${BEFORE_SHA}"
          fi
          if [[ -z "${base}" ]]; then
            echo "run=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${base}" HEAD > "${RUNNER_TEMP}/image-files.txt"
          decision=$(node scripts/ci/e2e-needed.js decide-images "${RUNNER_TEMP}/image-files.txt")
          echo "run=${decision}" >> "$GITHUB_OUTPUT"
          [[ "${decision}" == "run" ]] || echo "Documentation-only change; images pass without building."
      - name: Lint Dockerfile
        if: steps.gate.outputs.run == 'run'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.${{ matrix.image }}
      - if: steps.gate.outputs.run == 'run'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        if: steps.gate.outputs.run == 'run'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          load: true
          push: false
          tags: open-garden-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan image
        if: steps.gate.outputs.run == 'run'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: open-garden-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          exit-code: '1'
          format: table

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: open_garden
          POSTGRES_PASSWORD: open_garden
          POSTGRES_DB: open_garden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_garden -d open_garden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://open_garden:open_garden@localhost:5432/open_garden
      CORS_ORIGIN: http://localhost:4200
      PLANT_PROVIDER: fixture
      PLANT_TEST_FIXTURES: 'true'
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Decide browser suite
        id: e2e-gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node scripts/ci/e2e-needed.js selfcheck
          base=""
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${BASE_REF}" --depth=1
            base="origin/${BASE_REF}"
          elif [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            git fetch --depth=1 origin "${BEFORE_SHA}"
            base="${BEFORE_SHA}"
          fi
          if [[ -z "${base}" ]]; then
            echo "run=run" >> "$GITHUB_OUTPUT"
            echo "No comparison commit; running the browser suite."
            exit 0
          fi
          git diff --name-only "${base}" HEAD > "${RUNNER_TEMP}/e2e-files.txt"
          git show "${base}:package.json" > "${RUNNER_TEMP}/e2e-base-package.json"
          decision=$(node scripts/ci/e2e-needed.js decide \
            "${RUNNER_TEMP}/e2e-files.txt" \
            "${RUNNER_TEMP}/e2e-base-package.json" \
            package.json)
          echo "run=${decision}" >> "$GITHUB_OUTPUT"
          if [[ "${decision}" == "run" ]]; then
            echo "Application or production dependency changes; running browsers."
          else
            echo "Diff cannot change the running app; e2e passes without browsers."
          fi
      - uses: ./.github/actions/setup-node
        if: steps.e2e-gate.outputs.run == 'run'
      - name: Playwright version
        id: playwright-version
        if: steps.e2e-gate.outputs.run == 'run'
        run: echo "version=$(npx playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        if: steps.e2e-gate.outputs.run == 'run'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: End-to-end tests
        if: steps.e2e-gate.outputs.run == 'run'
        run: bash scripts/ci/e2e.sh
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            apps/web-e2e/playwright-report/
            apps/web-e2e/test-results/
