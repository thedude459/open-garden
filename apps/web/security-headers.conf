# Included in every location: nginx drops server-level add_header directives in
# any location that sets its own, so these are repeated, not inherited.
#
# CSP: scripts only from this origin (the production build has no inline
# scripts; critical-CSS inlining is off). Styles allow 'unsafe-inline' because
# Angular injects component styles at runtime. The only third party is the
# OpenStreetMap embed (iframe) and the reachability check the page makes for it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://www.openstreetmap.org; frame-src https://www.openstreetmap.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
