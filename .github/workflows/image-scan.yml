name: Image scan

# New vulnerabilities are published against images that have not changed, so
# every day (ADR 0041):
# - scan the latest released images on ghcr.io;
# - build both images from main and scan them; when one has a fixable HIGH or
#   CRITICAL finding, rebuild it on each allowed base-image tag
#   (.github/base-images.json) to find a base that is clean;
# - keep one issue, labelled security, up to date with what was found and
#   which base would fix it, and close it once main's images are clean.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  released:
    name: released (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      # For .trivyignore: time-limited exceptions apply here too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan ghcr.io/${{ github.repository_owner }}/open-garden-${{ matrix.image }}:latest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/open-garden-${{ matrix.image }}:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          trivyignores: .trivyignore
          exit-code: '1'
          format: table

  main:
    name: main (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The candidate builds in image-watch.sh load into the local docker.
          driver: docker
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # as trivy-action v0.36.0 uses
        with:
          version: v0.70.0
          cache: true
      - name: Date for OS package updates
        id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build image from main
        env:
          IMAGE: ${{ matrix.image }}
          TODAY: ${{ steps.today.outputs.date }}
        run: |
          docker buildx build --load --build-arg "OS_PACKAGES_DATE=${TODAY}" \
            -f "Dockerfile.${IMAGE}" -t "open-garden-${IMAGE}:main" .
      - name: Scan, and try the other allowed bases if it is not clean
        env:
          IMAGE: ${{ matrix.image }}
          TODAY: ${{ steps.today.outputs.date }}
        run: scripts/ci/image-watch.sh "${IMAGE}" "${TODAY}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-watch-${{ matrix.image }}
          path: image-watch-${{ matrix.image }}.md
          retention-days: 7

  report:
    name: report
    needs: main
    # Also when a main job failed: the report then says so and closes nothing.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Open, update, or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s nullglob
          gh run download "$RUN_ID" --repo "$REPO" --pattern 'image-watch-*' --dir reports || true
          reports=(reports/*/image-watch-*.md)
          title="Fixable vulnerabilities in the images built from main"
          findings=0
          for f in "${reports[@]}"; do
            n=$(sed -nE '1s/^<!-- findings: ([0-9]+) -->$/\1/p' "$f")
            findings=$((findings + ${n:-0}))
          done
          {
            echo "The daily [Image scan](${RUN_URL}) builds the images from \`main\` and scans them (ADR 0041)."
            echo
            for f in "${reports[@]}"; do tail -n +2 "$f"; echo; done
            if (( ${#reports[@]} < 2 )); then echo "An image did not build or scan; see the run."; fi
          } > body.md
          existing=$(gh issue list --repo "$REPO" --state open --label security \
            --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if (( findings > 0 )); then
            gh label create security --repo "$REPO" --color b60205 \
              --description "Security findings" 2>/dev/null || true
            if [[ -n "$existing" ]]; then
              gh issue edit "$existing" --repo "$REPO" --body-file body.md
            else
              gh issue create --repo "$REPO" --title "$title" --label security --body-file body.md
            fi
            exit 1
          fi
          # Close only when both images were built and scanned clean.
          if [[ -n "$existing" ]] && (( ${#reports[@]} == 2 )); then
            gh issue close "$existing" --repo "$REPO" \
              --comment "The images built from \`main\` scan clean ([run](${RUN_URL}))."
          fi
          if (( ${#reports[@]} < 2 )); then exit 1; fi
