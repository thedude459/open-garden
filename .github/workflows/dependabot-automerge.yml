name: Dependabot auto-merge

# Patch and minor updates merge on their own once every required check passes.
# Major updates (breaking by semver, and the most likely place for a hijacked
# release to land) wait for a human review.
on: pull_request

permissions:
  contents: read

jobs:
  automerge:
    name: automerge
    runs-on: ubuntu-latest
    # The PR author, not the actor: a human re-running the job must not turn
    # their own PR into an auto-merged one, and vice versa.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read update metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge (patch and minor only)
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          enabled="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "$enabled" == "true" ]]; then
            echo "auto-merge already enabled"
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
      - name: Leave major updates for review
        if: steps.meta.outputs.update-type != 'version-update:semver-patch' && steps.meta.outputs.update-type != 'version-update:semver-minor'
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
        run: echo "Not auto-merging ${DEPS} (${UPDATE_TYPE:-unknown update type}); needs review."
