version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # TypeScript majors wait until typescript-eslint supports them: its
    # 8.72 peer range is typescript >=4.8.4 <6.1.0, so TypeScript 7 would break
    # linting. Remove this ignore once a typescript-eslint release allows 7.x.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    # One PR per group. First match wins. Angular spans production and
    # development so the compiler and the build plugin move together.
    # Nest/Vitest majors stay together. Other ungrouped majors stay individual.
    # Security updates stay ungrouped so one new advisory cannot hold an
    # unrelated patch in the same pull request.
    groups:
      angular:
        applies-to: version-updates
        patterns:
          - '@angular/*'
      nestjs-major:
        applies-to: version-updates
        patterns:
          - '@nestjs/*'
        update-types:
          - major
      vitest-major:
        applies-to: version-updates
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - major
      production-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # First match wins. Keep CodeQL init + analyze on one SHA.
      codeql-action:
        patterns:
          - 'github/codeql-action*'
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'

  # Base images (node, nginx) in Dockerfile.api / Dockerfile.web.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  # postgres image in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # A Postgres major upgrade needs a dump and restore of existing volumes;
      # do it deliberately, not from an automated PR.
      - dependency-name: postgres
        update-types:
          - version-update:semver-major
