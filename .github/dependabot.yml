version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # typescript-eslint does not support TypeScript 7.0 yet
    # (https://github.com/typescript-eslint/typescript-eslint/issues/10940).
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    # Minor/patch bumps share one PR per dependency type. Majors stay ungrouped.
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # CodeQL init and analyze must share one release SHA; grouping keeps them in lockstep.
    groups:
      codeql-action:
        patterns:
          - 'github/codeql-action*'
